# Sécurité — les secrets sur chaque PR prête ; les trois scanners chaque lundi.
# Source : sophos (construire, « Chaque contrôle une fois »). Identique dans tous les dépôts.
#
# - gitleaks    : cherche une clé, un token ou un mot de passe. Sur une PR, dans ses seuls
#                 commits ; le lundi, dans tout l'historique. Une clé commitée reste lisible
#                 même supprimée ensuite.
# - osv-scanner : compare les dépendances (lockfiles) à la base publique des failles connues
#                 OSV.dev. Une faille est publiée à sa date, pas à celle d'un changement : le lundi.
# - semgrep     : relit notre propre code à la recherche de motifs dangereux (injection,
#                 secret en dur, route sans contrôle). Le lundi. Il s'installe dans un
#                 environnement Python à part, sans conteneur : le même job tourne sur le
#                 runner de GitHub et sur celui du Mac (Python 3.10 ou plus).
#
# Le runner se choisit par la variable RUNNER du dépôt, en JSON, comme dans controles.yml.

name: Sécurité

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "47 5 * * 1"

permissions:
  contents: read

concurrency:
  group: securite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Installer gitleaks 8.30.1
        run: |
          # Le binaire suit le système du runner (GitHub sur Linux, le Mac d'Antoine sur macOS) ; un autre système échoue.
          case "$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)" in
            linux-x86_64) cible=linux_x64 ;;
            darwin-arm64) cible=darwin_arm64 ;;
            darwin-x86_64) cible=darwin_x64 ;;
            *) echo "Système non pris en charge : $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${cible}.tar.gz" | tar -xz gitleaks
      - name: Analyser les commits de la PR, ou tout l'historique le lundi
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            ./gitleaks git --redact --verbose --exit-code 1 --log-opts "origin/$BASE..HEAD" .
          else
            ./gitleaks git --redact --verbose --exit-code 1 .
          fi

  dependances:
    name: Dépendances (osv-scanner)
    if: github.event_name == 'schedule'
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Installer osv-scanner 2.7.0
        run: |
          case "$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)" in
            linux-x86_64) cible=linux_amd64 ;;
            darwin-arm64) cible=darwin_arm64 ;;
            darwin-x86_64) cible=darwin_amd64 ;;
            *) echo "Système non pris en charge : $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_${cible}"
          chmod +x osv-scanner
      - name: Comparer les dépendances aux failles connues
        run: |
          set +e
          ./osv-scanner scan source --recursive .
          code=$?
          # 128 = aucun fichier de dépendances trouvé : rien à vérifier.
          if [ "$code" -eq 128 ]; then echo "Aucune dépendance déclarée."; exit 0; fi
          exit $code

  code:
    name: Code (semgrep)
    if: github.event_name == 'schedule'
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Installer semgrep 1.182.1, hors du dépôt
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet semgrep==1.182.1
      - name: Relire le code
        run: |
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --config p/default --error --metrics off
