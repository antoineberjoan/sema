name: Travail sema
description: Relier une intention à un résultat vérifiable.
title: ""
body:
  - type: textarea
    id: intent
    attributes:
      label: Intention et source
      description: Besoin concret, page Notion et date de lecture, ou reproduction d’un bug.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Résultat observable
      description: Ce qui permettra de dire que le travail est terminé.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Périmètre et arbitrages
      description: Contraintes utiles et désaccord de versions éventuel à trancher.
