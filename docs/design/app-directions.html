<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased;color:#262626;background:#e9e8e5;--paper:#fbfbfa;--ink:#242424;--muted:#858582;--soft:#efefed;--line:#e9e9e6;--chart:#565957;--side:#f2f2f0;--selected:#e5e5e2;--accent:#3478f6}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,a:focus-visible{outline:2px solid #3478f6;outline-offset:4px}a{color:inherit}header.gallery{max-width:1160px;margin:32px auto 0;display:flex;align-items:center;justify-content:space-between;gap:24px}.gallery-brand{font-size:18px;font-weight:600;letter-spacing:-.6px}.gallery-brand span{font-weight:400;color:#777;margin-left:16px;font-size:12px;letter-spacing:0}.concept-tabs{display:flex;gap:4px;padding:4px;background:#dededb;border-radius:12px}.concept-tabs button{padding:9px 15px;font-size:12px;border-radius:9px;white-space:nowrap}.concept-tabs button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px #0000000b}.theme{font-size:12px;width:68px}.intro{max-width:1160px;margin:27px auto 22px;display:flex;justify-content:space-between;align-items:baseline}.intro h1{font-size:18px;letter-spacing:-.5px;font-weight:550;margin:0}.intro p{font-size:12px;color:#767672;margin:0}.stage{width:1160px;height:656px;transform-origin:top left}.stage-wrap{width:min(1160px,calc(100% - 64px));margin:0 auto}.window{height:656px;background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 28px 60px #00000018,0 2px 7px #0000000d;position:relative}.traffic{display:flex;gap:8px;align-items:center}.traffic i{width:11px;height:11px;border-radius:50%;background:#ff6058}.traffic i:nth-child(2){background:#ffbd2e}.traffic i:nth-child(3){background:#28c840}.titlebar{height:62px;display:flex;align-items:center;padding:0 25px;gap:24px}.toolbar{margin-left:auto;display:flex;gap:20px;align-items:center;color:var(--muted);font-size:17px}.name{font-size:13px;letter-spacing:-.3px;font-weight:550}.symbol{width:40px;height:40px;display:block}.glyph{width:17px;height:17px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.subtle{color:var(--muted)}.periods{display:flex;gap:6px;color:var(--muted);font-size:11px;align-items:center}.periods span{padding:6px 9px;border-radius:6px}.periods .on{background:var(--soft);color:var(--ink)}.value{font-variant-numeric:tabular-nums;letter-spacing:-2.3px;font-size:58px;font-weight:450;line-height:1.1}.value small{font-size:19px;letter-spacing:-.4px;color:var(--muted);margin-left:5px;font-weight:400}.change{font-size:12px;color:var(--muted);margin-top:12px}.plot{width:100%;overflow:visible;display:block;color:var(--chart)}.plot .grid{stroke:var(--line);stroke-width:1}.plot .curve{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.plot text{font-family:inherit;fill:var(--muted);font-size:10px}.meta{font-size:10px;color:var(--muted)}.footnote{max-width:1160px;margin:22px auto 30px;display:flex;justify-content:space-between;gap:24px;font-size:11px;color:#777771;line-height:1.6}.footnote p{margin:0}.footnote a{text-decoration:none;border-bottom:1px solid #bbb}.screen[hidden]{display:none!important}.pill{background:var(--soft);padding:9px 14px;border-radius:20px;font-size:11px;display:inline-flex;align-items:center;gap:7px}.mini{width:110px;height:36px;display:block;color:var(--chart)}.mini path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

<header class="gallery"><div class="gallery-brand">sema <span>Études d’interface · 01</span></div><nav class="concept-tabs" aria-label="Choisir une maquette"><button aria-pressed="true" data-screen="atelier">01 Atelier</button><button aria-pressed="false" data-screen="focus">02 Focus</button><button aria-pressed="false" data-screen="journal">03 Journal</button><button aria-pressed="false" data-screen="sheet">04 Feuille</button><button aria-pressed="false" data-screen="ribbon">05 Horizon</button></nav><button class="theme" aria-label="Passer en mode sombre">Sombre ◐</button></header>
<div class="intro"><h1 id="concept-title">01 — Atelier</h1><p id="concept-description">Une sidebar discrète. Un seul repère au premier plan.</p></div>

<script>
const descriptions={atelier:['01 — Atelier','Une sidebar discrète. Un seul repère au premier plan.'],focus:['02 — Focus','Sans sidebar. Le graphique devient toute l’interface.'],journal:['03 — Journal','Une lecture éditoriale, avec un repère principal et trois observations.'],sheet:['04 — Feuille','Les chiffres s’alignent. La comparaison remplace les cartes.'],ribbon:['05 — Horizon','Un bandeau de verre, posé sur le bureau. Le hub reste en retrait.']};
const icons={search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="m9 3 1-1h4l1 1 1 3 3 1 2 3v4l-2 2-3 1-1 3h-4l-1-3-3-1-2-2v-4l2-3 3-1Z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',bell:'<path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Zm5 3h4"/>',plus:'<path d="M12 4v16M4 12h16"/>',arrow:'<path d="m4 16 6-7 4 3 6-8M15 4h5v5"/>'};

function plot(type='euro',id='plot'){return `<svg class="plot" viewBox="0 0 800 260" preserveAspectRatio="none" role="img" aria-label="Historique fictif sur un an"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity=".07"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><path class="grid" d="M0 40H750 M0 120H750 M0 200H750"/><text x="766" y="44">1,17</text><text x="766" y="124">1,12</text><text x="766" y="204">1,07</text><g transform="translate(0 30) scale(2.46 1.8)"><path d="${curves[type]}V105H0Z" fill="url(#${id})"/><path class="curve" d="${curves[type]}" vector-effect="non-scaling-stroke"/></g><text x="0" y="253">Oct. 2025</text><text x="231" y="253">Janv.</text><text x="453" y="253">Avr.</text><text x="674" y="253">Juill.</text></svg>`}

const journal=`<section class="window journal screen" aria-label="Maquette Journal"><div class="titlebar">${traffic}<span class="name">sema</span><div class="toolbar">${icon('search')}${icon('gear')}</div></div><div class="journal-content"><div class="journal-top"><h2>Vos repères.</h2><p>Vendredi 16 octobre</p></div><div class="journal-grid"><div class="journal-feature"><div class="kicker">À la une</div><h3>Euro / Dollar</h3><div class="value">1,1642<small>USD</small></div><div class="change">+4,00 % sur un an</div>${plot('euro','journal-fill')}<div class="meta">BCE · 15 octobre 2026</div></div><div class="journal-items"><div class="kicker" style="margin-bottom:-9px">Votre sélection</div><div class="journal-item"><div><p>Emprunt phare FR · 10 ans</p><strong>3,42 %</strong><small>−0,14 pt</small></div>${mini('oat')}</div><div class="journal-item"><div><p>Taux de dépôt BCE</p><strong>2,00 %</strong><small>−1,25 pt</small></div>${mini('bce')}</div><div class="journal-item"><div><p>Livret A</p><strong>1,70 %</strong><small>0,00 pt</small></div>${mini('flat')}</div></div></div><div class="journal-footer"><span class="meta">Sélection personnelle · Variations sur un an</span><span class="pill">${icon('plus')}Ajouter un repère</span></div></div></section>`;

const screens={atelier,focus,journal,sheet,ribbon};const stage=document.getElementById('stage');
